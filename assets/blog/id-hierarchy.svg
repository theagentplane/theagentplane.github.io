<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace">
  <rect x="0" y="0" width="920" height="300" rx="14" fill="#ffffff" stroke="#e5e8eb" stroke-width="1.5"/>

  <!-- box template: 200x120, y=90 -->
  <!-- Session -->
  <g>
    <rect x="30" y="86" width="190" height="128" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="125" y="114" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8c959f">SESSION</text>
    <text x="125" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2128">Conversation</text>
    <text x="125" y="168" text-anchor="middle" font-size="11.5" fill="#3563e9">session_id</text>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#57606a">sess_abc</text>
  </g>

  <text x="252" y="145" text-anchor="middle" font-size="11" fill="#8c959f">1 : N</text>
  <path d="M225 150 L275 150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Message -->
  <g>
    <rect x="280" y="86" width="190" height="128" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="375" y="114" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8c959f">MESSAGE</text>
    <text x="375" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2128">One user turn</text>
    <text x="375" y="168" text-anchor="middle" font-size="11.5" fill="#3563e9">message_id</text>
    <text x="375" y="186" text-anchor="middle" font-size="11" fill="#57606a">msg_042</text>
  </g>

  <text x="502" y="145" text-anchor="middle" font-size="11" fill="#8c959f">1 : 1</text>
  <path d="M475 150 L525 150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Trace -->
  <g>
    <rect x="530" y="86" width="190" height="128" rx="10" fill="#eef2ff" stroke="#3563e9" stroke-width="1.5"/>
    <text x="625" y="114" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#3563e9">CHRONICLE</text>
    <text x="625" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2128">One agent run</text>
    <text x="625" y="168" text-anchor="middle" font-size="11.5" fill="#3563e9">trace_id</text>
    <text x="625" y="186" text-anchor="middle" font-size="11" fill="#57606a">trace-9f2a1</text>
  </g>

  <text x="752" y="145" text-anchor="middle" font-size="11" fill="#8c959f">1 : N</text>
  <path d="M725 150 L775 150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Envelope -->
  <g>
    <rect x="780" y="86" width="190" height="128" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="875" y="114" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#8c959f">ENVELOPE</text>
    <text x="875" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2128">One LLM/tool call</text>
    <text x="875" y="168" text-anchor="middle" font-size="11.5" fill="#3563e9">envelope_id</text>
    <text x="875" y="186" text-anchor="middle" font-size="11" fill="#57606a">env-004</text>
  </g>

  <text x="460" y="252" text-anchor="middle" font-size="12" fill="#57606a" font-weight="600">A ticket gives you the left two. Chronicle gets you from there to the exact call on the right.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
